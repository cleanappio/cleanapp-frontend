name: Deploy frontend

# Every merge to main builds the frontend image with Cloud Build and restarts
# the container on the prod VM, using the same fastFEdeploy.sh that was
# previously run by hand. Manual runs can target dev instead.
#
# Required repository secret:
#   GCP_SA_KEY  - JSON key for github-deployer@cleanup-mysql-v2.iam.gserviceaccount.com
#                 (Cloud Build Editor, Artifact Registry Writer, Storage Object Admin,
#                  Compute Instance Admin v1, Service Account User, Secret Manager Secret Accessor)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [prod, dev]
        default: prod

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'prod' }}
      DEPLOY_SOURCE_SHA: ${{ github.sha }}
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the .version bump below can be pushed back.
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: cleanup-mysql-v2

      - name: Seed latest automated production version
        if: env.TARGET_ENV == 'prod'
        run: python3 scripts/deploy-version.py seed --source-sha "$DEPLOY_SOURCE_SHA"

      - name: Verify build upload excludes CI credentials
        run: |
          upload_manifest=$(mktemp "$RUNNER_TEMP/cleanapp-upload-manifest.XXXXXX")
          trap 'rm -f "$upload_manifest"' EXIT
          gcloud meta list-files-for-upload > "$upload_manifest"
          python3 - "$upload_manifest" <<'PY'
          from pathlib import Path
          import re
          import sys

          files = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          if any(re.search(r"(^|/)gha-creds-.*\.json$", name) for name in files):
              sys.exit("Build source upload must exclude CI credentials.")
          PY

      - name: Build image and deploy to VM
        id: build
        run: |
          chmod +x fastFEdeploy.sh
          ./fastFEdeploy.sh -e "$TARGET_ENV" --source-sha "$DEPLOY_SOURCE_SHA" --metadata-file "$RUNNER_TEMP/frontend-build.json"
          echo "version=$(python3 scripts/deploy-version.py read)" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: env.TARGET_ENV == 'prod'
        env:
          BUILT_VERSION: ${{ steps.build.outputs.version }}
        run: python3 scripts/deploy-version.py publish --source-sha "$DEPLOY_SOURCE_SHA" --version "$BUILT_VERSION"

      - name: Smoke test
        if: always() && !cancelled() && env.TARGET_ENV == 'prod' && steps.build.outcome == 'success'
        run: |
          # The container needs a little time after restart; retry for up to ~2 minutes.
          for path in / /incident-reporting /sitemap.xml /robots.txt; do
            for attempt in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.cleanapp.io$path")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Notify search engines (IndexNow)
        if: env.TARGET_ENV == 'prod'
        run: |
          # Bing, Yahoo, DuckDuckGo and others pick up IndexNow pings; key file lives in public/.
          urls=$(curl -s https://www.cleanapp.io/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<\/\?loc>//g' | python3 -c 'import sys,json; print(json.dumps([u.strip() for u in sys.stdin if u.strip()]))')
          curl -s -o /dev/null -w "IndexNow -> %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"www.cleanapp.io\",\"key\":\"6198de183ff2b7b95116057ea654c51c\",\"keyLocation\":\"https://www.cleanapp.io/6198de183ff2b7b95116057ea654c51c.txt\",\"urlList\":$urls}"
